name: Enola Architecture Check
description: Catch architectural regressions introduced by a pull request
author: enola-labs
branding:
  icon: git-pull-request
  color: purple

inputs:
  version:
    description: Enola release version, or latest
    default: latest
  binary:
    description: >-
      Path to an Enola-compatible executable to grade with, instead of downloading a
      release. Relative paths resolve against the workspace. Takes precedence over version.
    required: false
  config:
    description: Optional repository-relative mcp-arch.yaml path
    required: false
  fail-on:
    description: >-
      Comma-separated explainer names whose new findings fail the job. Unset means
      nothing fails: findings are reported and the job stays green.
    required: false
  min-confidence:
    description: Confidence floor within failing explainers
    required: false
  warn-only:
    description: Report regressions without failing the job
    default: "false"
  focus:
    description: Narrow the delta to this module, file, or symbol
    required: false
  detail:
    description: Include the complete structural delta in the job summary
    default: "false"
  target:
    description: Symbol, type, or package intended to change
    required: false
  expected:
    description: Additional expected packages, comma separated
    required: false
  max-spillover:
    description: Fail when spillover exceeds this count
    required: false
  reviewers:
    description: >-
      Report who owns the modules this change touched, and suggest a reviewer where the
      author is a minor contributor. Reads git author names; never fails the job. Needs
      history, so check out with fetch-depth 0.
    default: "false"
  reviewer-window:
    description: With reviewers, how many recent commits authorship is measured over (Enola default 500)
    required: false
  author:
    description: >-
      With reviewers, whose change this is, as git history spells the name. Defaults to
      the author of the pull request's head commit.
    required: false
  base-sha:
    description: Explicit base commit override
    required: false
  annotations:
    description: Emit source annotations
    default: "true"
  sarif:
    description: >-
      Write the findings as a SARIF 2.1.0 file and expose its path as the sarif-file
      output, for upload to GitHub code scanning.
    default: "false"
  summary:
    description: Write the GitHub job summary
    default: "true"
  pr-comment:
    description: >-
      Also post the report as a pull request comment, edited in place on every push. Needs
      `pull-requests: write`. A comment that cannot be posted is a warning and never changes
      the job's outcome; pull requests from forks get a read-only token and no comment.
    default: "false"
  pr-comment-when:
    description: >-
      With pr-comment, when to post: auto (always while nothing is enforced, otherwise only
      when the job fails), always, findings (anything reported), or failure. A failed job is
      always commented on. An existing comment the current run does not earn is replaced by
      a one-line passing note, so it never goes stale.
    default: auto
  pr-comment-key:
    description: >-
      With pr-comment, what identifies this step's comment. Defaults to working-directory, so
      several steps in one workflow each keep their own. Set it when two steps share one.
    required: false
  working-directory:
    description: Repository-relative project directory
    default: "."
  token:
    description: >-
      GitHub token used to resolve the latest Enola release version and, with pr-comment, to
      post the comment
    default: ${{ github.token }}

outputs:
  status:
    description: >-
      clean, partial_clean, regression, partial_regression, usage_error, or incomparable.
      The partial_ forms mean Enola graded only the producers both snapshots share,
      because the two were produced by different extractor or provider sets. They pass
      and fail exactly as their whole-verdict counterparts do.
  partial:
    description: true when the verdict graded only the shared producer set
  regressions:
    description: >-
      Number of failing findings plus fatal measurement breaches, i.e. everything that
      made the job red. A max-spillover breach counts here and carries no finding.
  advisories:
    description: Number of advisory findings
  facts-added:
    description: Facts added by the change
  facts-removed:
    description: Facts removed by the change
  edges-added:
    description: Edges added by the change
  edges-removed:
    description: Edges removed by the change
  ungraded-facts:
    description: Facts a partial verdict could not grade, across every excluded producer
  ungraded-findings:
    description: Findings a partial verdict could not grade, across every excluded producer
  verdict-file:
    description: Path to the complete JSON verdict
  sarif-file:
    description: Path to the SARIF file, when the sarif input is set
  comment-url:
    description: URL of the pull request comment, when pr-comment created or updated one

runs:
  using: node24
  main: dist/index.js
